[package]
name = "uzlinux-studio"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
open = "5.3"
dirs = "6.0"
rfd = "0.17.2"
zip = { version = "9.0.4", default-features = false, features = ["deflate"] }
chrono = "0.4"

[build-dependencies]
slint-build = "1.9"
