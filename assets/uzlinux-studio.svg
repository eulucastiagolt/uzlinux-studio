<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Outer Deck Body -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Inner Plate -->
  <rect x="16" y="16" width="96" height="96" rx="18" fill="#18191c" stroke="#2563eb" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- LCD Key Grid (3x5 Representation) -->
  <rect x="24" y="24" width="12" height="12" rx="3" fill="url(#blueGrad)" />
  <rect x="40" y="24" width="12" height="12" rx="3" fill="#334155" />
  <rect x="56" y="24" width="12" height="12" rx="3" fill="#334155" />
  <rect x="72" y="24" width="12" height="12" rx="3" fill="#334155" />
  <rect x="88" y="24" width="16" height="12" rx="3" fill="url(#blueGrad)" />

  <rect x="24" y="42" width="12" height="12" rx="3" fill="#334155" />
  <rect x="40" y="42" width="12" height="12" rx="3" fill="url(#blueGrad)" />
  <rect x="56" y="42" width="12" height="12" rx="3" fill="#334155" />
  <rect x="72" y="42" width="12" height="12" rx="3" fill="url(#blueGrad)" />
  <rect x="88" y="42" width="16" height="12" rx="3" fill="#334155" />

  <rect x="24" y="60" width="12" height="12" rx="3" fill="#334155" />
  <rect x="40" y="60" width="12" height="12" rx="3" fill="#334155" />
  <rect x="56" y="60" width="12" height="12" rx="3" fill="url(#blueGrad)" />
  <!-- Wide Screen Key Representation -->
  <rect x="72" y="60" width="32" height="12" rx="3" fill="url(#glowGrad)" />

  <!-- Brand Typography -->
  <text x="64" y="100" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="1">UZLINUX</text>
</svg>
